 case 'seesaw':{ctx.save();ctx.rotate(t.angle*.25+Math.sin(tm*2+t.t)*.1);ctx.strokeStyle=ink;ctx.lineWidth=3.3;ctx.beginPath();ctx.moveTo(-17,-7);ctx.lineTo(17,1);ctx.stroke();ctx.restore();ctx.fillStyle=p.paper;polygon([[-8,15],[8,15],[0,0]]);ctx.fill();break;}
 case 'magnet':{ctx.strokeStyle=p.paper;ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,1,12,Math.PI*.14,Math.PI*.86,true);ctx.stroke();ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,1,12,.14*Math.PI,.86*Math.PI,true);ctx.stroke();text('∿',0,6,'19px Georgia',ink);break;}
 case 'cloud':{ctx.fillStyle=p.paper;ellipse(-6,3,10,8);ctx.fill();ellipse(4,-3,11,10);ctx.fill();ellipse(12,5,8,6);ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(-10,13);ctx.lineTo(-10,20);ctx.moveTo(0,13);ctx.lineTo(0,20);ctx.moveTo(10,13);ctx.lineTo(10,20);ctx.stroke();break;}
 case 'tree':{text('✳',0,11,'31px Georgia',p.paper);break;}
 case 'bowl':{ctx.strokeStyle=p.paper;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-3,13,.08*Math.PI,.92*Math.PI);ctx.stroke();ctx.fillStyle=ink;ellipse(0,10,4,4);ctx.fill();break;}
 case 'bubble':{ctx.fillStyle='#fffaf2a1';ellipse(0,1,15,15);ctx.fill();ctx.strokeStyle=p.paper;ctx.lineWidth=2.4;ctx.stroke();ctx.fillStyle='#ffffffcf';ellipse(-6,-6,4,2.5,-.6);ctx.fill();break;}
 case 'clock':{ctx.strokeStyle=p.paper;ctx.lineWidth=3.2;ellipse(0,0,15,15);ctx.stroke();ctx.save();ctx.rotate(tm*.7);ctx.strokeStyle=ink;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(0,1);ctx.lineTo(9,5);ctx.stroke();ctx.restore();break;}
 case 'portal':case 'moon':{ctx.strokeStyle=p.paper;ctx.lineWidth=2.9;ellipse(0,0,15,13);ctx.stroke();ctx.save();ctx.rotate(tm*.7);ctx.strokeStyle=ink;ctx.beginPath();ctx.arc(0,0,10,-.2,4.7);ctx.stroke();ctx.restore();break;}
 case 'bell':{ctx.fillStyle=p.paper;ctx.beginPath();ctx.moveTo(-14,9);ctx.quadraticCurveTo(-8,0,-9,-5);ctx.quadraticCurveTo(-8,-17,0,-17);ctx.quadraticCurveTo(9,-17,9,-5);ctx.quadraticCurveTo(8,1,14,9);ctx.closePath();ctx.fill();ellipse(0,13,4,4);ctx.fill();break;}
 case 'mirror':{ctx.save();ctx.rotate(.6);ctx.fillStyle=p.paper;roundedRect(-10,-16,20,32,4);ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=2;roundedRect(-10,-16,20,32,4);ctx.stroke();ctx.strokeStyle='#79aaa5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-5,-11);ctx.lineTo(4,6);ctx.moveTo(2,-9);ctx.lineTo(6,-1);ctx.stroke();ctx.restore();break;}
 case 'rotor':case 'sun':{ctx.save();ctx.rotate(t.angle);for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.fillStyle=p.paper;ellipse(0,-10,6.5,13,.25);ctx.fill();}ctx.fillStyle=ink;ellipse(0,0,5,5);ctx.fill();ctx.restore();break;}
 case 'feeder':{ctx.strokeStyle=ink;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(-16,11);ctx.quadraticCurveTo(0,20,16,11);ctx.stroke();ctx.fillStyle=p.paper;polygon([[-8,-3],[6,-10],[13,-3],[6,5]]);ctx.fill();ctx.fillStyle=ink;ellipse(5,-4,1.4,1.4);ctx.fill();break;}
 case 'yarn':{ctx.strokeStyle='#f6e3c3';ctx.lineWidth=2;for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(Math.cos(k*2)*5,Math.sin(k*2)*5,12,tm*.5+k,tm*.5+k+4.5);ctx.stroke();}text('∿',1,6,'22px Georgia',ink);break;}
 case 'shadow':{catFace(0,0,.75,'#303438','#f1d39a',false);ctx.strokeStyle='#e8c795';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-11,1);ctx.lineTo(-5,3);ctx.moveTo(7,3);ctx.lineTo(12,1);ctx.stroke();break;}
 case 'dust':{ctx.fillStyle=p.paper;for(let k=0;k<5;k++){ellipse(Math.cos(k*TAU/5)*8,Math.sin(k*TAU/5)*7,7,8);ctx.fill();}ellipse(-5,0,1.5,2);ctx.fillStyle=ink;ctx.fill();ellipse(5,0,1.5,2);ctx.fill();break;}
 default:text('✳',0,10,'25px Georgia',p.paper);}
}
function drawFieldEffects(){const p=THEMES[state.phase],tm=state.worldTime;ctx.save();for(const t of state.tiles){if(t.removed)continue;const q=tilePos(t),x=t.visualX||q.x,y=t.visualY||q.y;if(y<state.cameraY-100||y>state.cameraY+H+100)continue;
 if(['magnet','cloud','dream','moon','yarn'].includes(t.kind)){let color=t.kind==='yarn'?'#c9886b':t.kind==='cloud'?'#8dbbbd':p.deep;ctx.strokeStyle=color;ctx.globalAlpha=.13+(Math.sin(tm*2+t.t)+1)*.035;ctx.lineWidth=1.2;const rad=51+Math.sin(tm*1.4+t.id)*5;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x,y,rad-i*12,tm*.22+i,tm*.22+i+Math.PI*1.6);ctx.stroke();}ctx.globalAlpha=1;}
 if(t.kind==='yarn'){ctx.strokeStyle='#be8c72';ctx.lineWidth=2;ctx.globalAlpha=.8;const len=55,wig=Math.sin(tm*2+t.id)*9;ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+wig-37,y-24,x+wig+40,y-44,x-15+wig,y-len);ctx.stroke();ctx.globalAlpha=1;}
 if(t.kind==='clock'&&t.captures.length){ctx.strokeStyle=p.accent;ctx.lineWidth=1.1;ellipse(x,y,31,31);ctx.stroke();}
 }
 ctx.restore();}
function drawBall(b){ctx.save();const n=b.trail.length;for(let i=0;i<n;i++){const q=b.trail[i];ctx.globalAlpha=(i/n)*.16;ctx.fillStyle=b.color;ellipse(q.x,q.y,b.r*(.22+i/n*.5),b.r*(.22+i/n*.5));ctx.fill();}ctx.globalAlpha=1;ctx.shadowColor='#314c4c55';ctx.shadowBlur=5;ctx.shadowOffsetY=2;ctx.fillStyle='#304b4b';ellipse(b.x,b.y,b.r+.55,b.r+.55);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle=b.color;ellipse(b.x-.35,b.y-.6,b.r-1,b.r-1);ctx.fill();ctx.fillStyle='#ffffffbd';ellipse(b.x-2.3,b.y-2.7,2.3,1.8,-.5);ctx.fill();ctx.restore();}
function aimPlan(){
 const a=state.aimAngle,points=[],targets=[],acceleration=gravity();
 for(const tile of state.tiles){
  if(tile.removed||tile.kind==='nest')continue;
  const p=tilePos(tile),scale=tileScale(tile);
  if(p.y<state.cameraY||p.y>state.cameraY+H+100)continue;
  targets.push({tile,x:p.x,y:p.y,hx:(tile.gateIndex!=null&&!tile.bossCore?30:21*scale)+7,hy:20*scale+7});
 }
 let x=300,y=state.cameraY+104,vx=Math.sin(a)*705,vy=Math.cos(a)*705,bounces=0;
 for(let i=0;i<90;i++){
  x+=vx/60;y+=vy/60;vy+=acceleration/60;
  if(x<34||x>566){x=clamp(x,34,566);vx=-vx*.88;bounces++;}
  if(y>state.cameraY+H-25||bounces>2)break;
  const target=targets.find(t=>Math.abs(t.x-x)<t.hx&&Math.abs(t.y-y)<t.hy);
  if(target)return{points,hit:{tile:target.tile,x,y},bounces};if(i%2===0)points.push({x,y});
 }
 return{points,hit:null,bounces};
}
function drawAim(){
 if(!state.started||state.paused||state.ended)return;
 const p=THEMES[state.phase],plan=aimPlan(),color=p.ink;
 ctx.save();ctx.fillStyle=color;
 for(let i=0;i<plan.points.length;i++){const q=plan.points[i];ctx.globalAlpha=.62*(1-i/(plan.points.length+8));ellipse(q.x,q.y-state.cameraY,2.8,2.8);ctx.fill();}
 if(plan.hit){
  const hit=plan.hit,t=hit.tile,q=tilePos(t),y=q.y-state.cameraY;ctx.globalAlpha=.8;ctx.strokeStyle=color;ctx.lineWidth=2.3;
  if(t.kind==='lever'){ellipse(q.x,y,25,25);ctx.stroke();}
  else if(t.kind==='switch'){ellipse(q.x,y,25+Math.sin(state.worldTime*3)*2,25+Math.sin(state.worldTime*3)*2);ctx.stroke();text('♬',q.x,y-29,'18px Georgia',color);}
  else if(!t.obstacle&&t.kind!=='cat'&&t.kind!=='nest'&&t.kind!=='boss'){
   const d=pushVector(t,hit),r=t.r+d.pushDr,c=t.c+d.pushDc;
   if(inside(r,c)){const merge=!!matchingNeighbor(t),dest=cellPos(r,c);ctx.strokeStyle=merge?'#cf9d39':color;ctx.setLineDash([4,4]);roundedRect(dest.x-24,dest.y-state.cameraY-25,48*t.span,48*t.span,11);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(q.x,y);ctx.lineTo(q.x+d.pushDc*32,y+d.pushDr*32);ctx.stroke();text(merge?'✦':d.pushDc?(d.pushDc>0?'→':'←'):'↓',q.x+d.pushDc*38,y+d.pushDr*38+6,'bold 19px Trebuchet MS',ctx.strokeStyle);}
  }else{ellipse(hit.x,hit.y-state.cameraY,10,10);ctx.stroke();}
 }
 ctx.restore();
}
function drawMergeFX(){
 ctx.save();
 for(const fx of state.mergeFX){
  const u=clamp(fx.age/fx.life,0,1),ease=1-Math.pow(1-u,3);
  ctx.globalAlpha=(1-u)*.76;
  ctx.fillStyle=fx.color;ctx.strokeStyle='#fff8e7';ctx.lineWidth=1.5;
  for(const [sx,sy] of [[fx.ax,fx.ay],[fx.bx,fx.by]]){
   const x=lerp(sx,fx.x,ease),y=lerp(sy,fx.y,ease)-Math.sin(u*Math.PI)*9;
   ellipse(x,y,8*(1-u)+2,8*(1-u)+2);ctx.fill();ctx.stroke();
  }
  ctx.globalAlpha=(1-u)*.64;ctx.strokeStyle='#f6e6a7';ctx.lineWidth=1.8+u*3;
  ctx.beginPath();ctx.arc(fx.x,fx.y,9+u*45,0,TAU);ctx.stroke();
 }
 ctx.restore();
}
function drawParticles(){ctx.save();for(const p of state.particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;if(p.kind==='star'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(state.worldTime*3);polygon([[0,-p.r*2],[p.r*.5,0],[0,p.r*2],[-p.r*.5,0]]);ctx.fill();ctx.restore();}else if(p.kind==='paw'){ellipse(p.x,p.y+3,p.r*1.5,p.r);ctx.fill();for(const dx of [-5,-1,3,7]){ellipse(p.x+dx,p.y-3-Math.abs(dx)*.1,1.5,2.5);ctx.fill();}}else{ellipse(p.x,p.y,p.r,p.r);ctx.fill();}}ctx.restore();}
function draw(){
 ctx.save();drawBg();
 ctx.save();ctx.beginPath();ctx.rect(24,112,552,H-125);ctx.clip();ctx.translate(0,-state.cameraY);
 drawZoneEffects();drawCourseScenery();drawGateFrames();drawGateWires();drawFieldEffects();for(const t of state.tiles)drawTile(t);drawMergeFX();drawContraptions();for(const b of state.active)drawBall(b);drawParticles();drawCatLinks();ctx.restore();
 drawBorders();drawHopper();drawAim();
 ctx.restore();
}
function stepSimulation(dt){
 state.worldTime+=dt;state.frame++;state.shootCooldown=Math.max(0,state.shootCooldown-dt);
 if(state.finalWaveActive||state.worldTime<state.boostUntil){if(state.shootCooldown<=0)createShot();}
 else if(state.showerActive){if(state.shootCooldown<=0)fireShowerShot();}
 else if(state.boostDisplayed){state.boostDisplayed=false;updateUI();}
 if(state.pointerDown){
  state.holdTime+=dt;
  if(state.holdTime>.26&&state.shootCooldown<=0&&createShot())state.pointerFired=true;
 }
 if(state.keyboardFire&&state.shootCooldown<=0)createShot();
 prePhysics(dt);phys.step(dt);updateContraptions(dt);postPhysics(dt);
 if(state.recordFlairUntil>0&&state.worldTime>=state.recordFlairUntil){state.recordFlairUntil=0;updateDistanceUI();}
 saveRun();
}
let previous=performance.now(),acc=0;
function loop(now){
 const delta=Math.min(.04,(now-previous)/1000||0);previous=now;
 if(state.started&&!state.paused&&!state.ended){
  acc+=delta;let steps=0;
  while(acc>=1/60&&steps<4){stepSimulation(1/60);acc-=1/60;steps++;}
  if(steps===4)acc=0;
 }else acc=0;
 draw();requestAnimationFrame(loop);
}
clear();if(!restoreRun()){state.started=true;saveRun(true);}requestAnimationFrame(loop);
// Introspectable for deterministic smoke-tests and debugging, without coupling gameplay to tests.
window.Purrchinko={state,createShot,startFinalWave,reset:startNew,saveRun,restoreRun,aim:setAim,getPhysics:()=>phys,createTile,merge,matchingNeighbor,popNearby,activateBell,freeCat,catAbility,openGate,impact,updateContraptions,step:(n=1)=>{for(let i=0;i<n;i++)stepSimulation(1/60);},THEMES};
})();
</script>
